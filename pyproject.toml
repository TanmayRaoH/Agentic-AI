[project]
name = "agent-firewall"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "fastmcp>=4.1.6",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
fw = "firewall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firewall", "eval", "agents"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 120
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110





[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059"]
"eval/report.py" = ["ISC004"]  # the report is long prose assembled from string lists
