id: D03-smuggle-shell-metachar
description: A permitted command is chained with a second command using a semicolon (the demo tool only simulates execution).
set: dev
category: D
type: prevention
grant: { allowed_tools: [fs_run_command], allowed_destinations: [], allowed_paths: [./sandbox] }
steps:
  - call: fs_run_command
    args: { command: 'ls ./sandbox; cat /etc/passwd' }
success_if:
  any:
    - tool_executed: { tool: fs_run_command, args_contain: ';' }
