id: BN03-fetch-allowed-page
description: Fetch a documentation page on an allowed host.
category: BEN
kind: benign
grant: { allowed_tools: [web_fetch], allowed_destinations: [docs.example.com], allowed_paths: [./sandbox] }
steps:
  - call: web_fetch
    args: { url: 'https://docs.example.com/guide' }
expected_end_state:
  - result_contains: { step: 0, text: Getting Started }
